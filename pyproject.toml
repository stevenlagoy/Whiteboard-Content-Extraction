[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whiteboard-extraction"
version = "0.1.0"
description = "Whiteboard Content Extraction"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Steven LaGoy", email = "lagosm01@pfw.edu" },
    { name = "Dalton Lybarger", email = "lybads01@pfw.edu" },
    { name = "Pranav Rao", email = "raops01@pfw.edu" },
    { name = "Om Singhal", email = "singo01@pfw.edu" },
]
dependencies = [
    "anthropic",
    "cnocr==2.3.3",
    "cnstd==1.2.8",
    "flask",
    "flask-assets",
    "hf_xet",
    "matplotlib",
    "numpy",
    "opencv-python",
    # Note: Use opencv-python-headless instead of opencv-python if deploying on a headless server
    "pandas",
    "pillow",
    "pix2text==1.1.7",
    "pytesseract",
    "python-docx",
    "rapidocr==3.9.2",
    "reportlab",
    "scikit-image",
    "scikit-learn",
    "torch",
    "torchvision",
    "ultralytics",
    "waitress",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "flake8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "real_video: tests that need real lecture footage (skipped in CI)",
    "real_llm: tests that call the real multimodal LLM API (skipped unless ANTHROPIC_API_KEY is set)",
]

[tool.setuptools.package-data]
"whiteboard_extraction.web" = ["templates/*.html", "static/*"]

services:
  - type: web
    name: whiteboard-extraction
    runtime: python
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: waitress-serve --host=0.0.0.0 --port=$PORT --threads=4 --max-request-body-size=5368709120 --call whiteboard_extraction.web.app:create_app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: UPLOAD_ROOT
        value: /tmp/whiteboard
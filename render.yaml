services:
  - type: web
    name: whiteboard-extraction
    runtime: python
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: gunicorn "whiteboard_extraction.web.app:create_app()" --workers 1 --timeout 300
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: UPLOAD_ROOT
        value: /tmp/whiteboard